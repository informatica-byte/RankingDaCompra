<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Radar desativado | Ranking da Compra</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f7f4;color:#10251d}
    main{width:min(620px,100%);padding:34px;border:1px solid #cce0d5;border-radius:20px;background:#fff;box-shadow:0 18px 48px rgba(14,72,51,.12);text-align:center}
    .selo{display:inline-flex;padding:7px 12px;border-radius:999px;background:#e7f5ec;color:#087a3d;font-weight:800;font-size:.78rem}
    h1{margin:18px 0 10px;font-size:clamp(1.8rem,6vw,2.7rem)}
    p{margin:0 auto 24px;max-width:48ch;color:#53645d;line-height:1.6}
    nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a{display:inline-flex;padding:12px 18px;border-radius:10px;background:#087a3d;color:#fff;text-decoration:none;font-weight:800}
    a.secundario{background:#fff;color:#087a3d;border:1px solid #087a3d}
  </style>
</head>
<body>
  <main>
    <span class="selo">Recurso desativado</span>
    <h1>O Radar foi desativado</h1>
    <p>O Ranking da Compra agora concentra seus recursos nas Promoções do Dia, Ofertas Relâmpago e melhores oportunidades da semana.</p>
    <nav>
      <a href="./#promocoes">Ver promoções</a>
      <a class="secundario" href="./#relampagos">Ver ofertas relâmpago</a>
    </nav>
  </main>
</body>
</html>

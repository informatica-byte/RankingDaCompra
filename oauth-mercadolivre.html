<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Autorizar Mercado Livre | Ranking da Compra</title>
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #172033;
            background: linear-gradient(145deg, #f4f8ff, #eefbf4);
        }
        main {
            width: min(620px, 100%);
            padding: 34px;
            border: 1px solid #dce4ef;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 55px rgba(23, 32, 51, .12);
        }
        .selo {
            display: inline-block;
            margin-bottom: 14px;
            padding: 7px 11px;
            border-radius: 999px;
            color: #075b35;
            background: #dcf7e9;
            font-weight: 800;
            font-size: .82rem;
        }
        h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 4vw, 2.2rem); }
        p { line-height: 1.6; color: #506078; }
        label { display: block; margin: 24px 0 8px; font-weight: 800; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #b9c6d8;
            border-radius: 10px;
            background: #f8fafc;
            font: inherit;
        }
        button, a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 14px;
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        button { color: #fff; background: #087443; }
        a { margin-left: 8px; color: #24405f; background: #eaf0f7; }
        .erro { color: #9d1c1c; background: #fff0f0; padding: 14px; border-radius: 10px; }
        small { display: block; margin-top: 18px; line-height: 1.5; color: #6c788b; }
    </style>
</head>
<body>
<main>
    <span class="selo">Autorização oficial</span>
    <h1 id="titulo">Conexão com o Mercado Livre</h1>
    <p id="mensagem">Conclua a autorização no Mercado Livre. Esta página não envia nem armazena sua senha ou seu código.</p>

    <div id="sucesso" hidden>
        <label for="codigo">Código de autorização temporário</label>
        <input id="codigo" type="text" readonly autocomplete="off">
        <button type="button" id="copiar">Copiar código</button>
        <a href="./dashboard.html">Voltar ao painel</a>
        <small>Guarde este código diretamente como segredo no GitHub. Não envie por WhatsApp, e-mail ou conversa.</small>
    </div>

    <p id="erro" class="erro" hidden></p>
</main>
<script>
    const parametros = new URLSearchParams(location.search);
    const codigo = parametros.get('code');
    const erro = parametros.get('error_description') || parametros.get('error');
    const sucesso = document.getElementById('sucesso');
    const caixaErro = document.getElementById('erro');

    if (codigo) {
        document.getElementById('codigo').value = codigo;
        document.getElementById('mensagem').textContent =
            'Autorização recebida. Copie o código abaixo para concluir a configuração segura no GitHub.';
        sucesso.hidden = false;
        document.getElementById('copiar').addEventListener('click', async (evento) => {
            await navigator.clipboard.writeText(codigo);
            evento.currentTarget.textContent = 'Código copiado';
        });
    } else {
        caixaErro.hidden = false;
        caixaErro.textContent = erro
            ? `O Mercado Livre não autorizou a conexão: ${erro}`
            : 'Nenhum código foi recebido. Inicie a autorização pelo endereço fornecido no painel do Mercado Livre.';
    }
</script>
</body>
</html>

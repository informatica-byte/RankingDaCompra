name: Localizar produto e codigo MLB


on:
  schedule:
    # Evita os minutos mais congestionados do GitHub Actions. O GitHub
    # documenta que execucoes agendadas podem atrasar ou ser descartadas
    # nos horarios de pico, principalmente no inicio de cada hora.
    # Duas conferências por hora são suficientes para a fila de até dez pedidos
    # e reduzem pela metade as leituras automáticas do Firestore.
    - cron: "7,37 * * * *"
  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false


jobs:
  localizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Baixar a versao atual do site
        uses: actions/checkout@v5
        with:
          # Um evento que aguardou a fila pode apontar para um SHA antigo.
          ref: main
          fetch-depth: 0


      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Autenticar leitura do Firestore sem chave permanente
        id: firestore-auth
        uses: ./.github/actions/firestore-read-auth


      - name: Instalar navegador automatizado
        run: npm install --no-save --ignore-scripts playwright-core@1.59.1


      - name: Abrir links e identificar anuncios
        id: resolver
        env:
          RDC_FIRESTORE_ACCESS_TOKEN: ${{ steps.firestore-auth.outputs.access_token }}
          RDC_FIRESTORE_AUTH_REQUIRED: "true"
          MERCADO_LIVRE_CLIENT_ID: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
          MERCADO_LIVRE_CLIENT_SECRET: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
          MERCADO_LIVRE_TOKEN_KEY: ${{ secrets.MERCADO_LIVRE_TOKEN_KEY }}
        run: |
          node --test scripts/test-audit-repairs.mjs scripts/test-localizer-diagnostics.mjs
          xvfb-run -a node scripts/resolve-affiliate-links.mjs


      - name: Publicar novos resultados
        id: publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --test scripts/test-localizer-publication.mjs
          node scripts/publish-localizer.mjs

      - name: Preservar resultados se a publicação não terminar
        if: always() && (steps.publicar.outcome == 'failure' || steps.resolver.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: localizador-recuperacao-${{ github.run_id }}
          # Apenas o cache já criptografado; nunca variáveis de ambiente/credenciais.
          path: |
            mlb-resolucoes.json
            .mercadolivre-token.enc
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

      - name: Sinalizar dados não obtidos após preservar os resultados
        if: steps.resolver.outputs.incomplete == 'true'
        env:
          QUEUE_STATUS: ${{ steps.resolver.outputs.queue_status }}
          RETRY_AFTER: ${{ steps.resolver.outputs.retry_after }}
          FAILED_COUNT: ${{ steps.resolver.outputs.failed_count }}
        run: |
          if [[ "$QUEUE_STATUS" == "quota" || "$QUEUE_STATUS" == "deferred" ]]; then
            echo "::error::Fila Firestore adiada por HTTP 429 (limite de uso). Próxima tentativa não antes de $RETRY_AFTER. Fila não confirmada como vazia. Não edite produtos por esta falha; resultados preservados."
          else
            echo "::error::O localizador não concluiu a obtenção dos dados. Falhas em pedidos: $FAILED_COUNT. Consulte o resumo da consulta/fila. Resultados preservados; use revisão manual para pedidos sem dados."
          fi
          exit 1



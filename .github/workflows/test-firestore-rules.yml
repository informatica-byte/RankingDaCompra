name: Testar regras Firestore em emulador
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firebase.emulator-tests.json', 'tests/firestore-rules/**', '.github/workflows/test-firestore-rules.yml']
  pull_request:
    paths: ['firestore.rules', 'firebase.emulator-tests.json', 'tests/firestore-rules/**', '.github/workflows/test-firestore-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_CLI_DISABLE_USAGE_REPORTING: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar ferramenta de teste fixada
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Instalar dependências fixadas
        run: pnpm --dir tests/firestore-rules install --frozen-lockfile --ignore-scripts
      - name: Testar somente projeto demo no emulador local
        working-directory: tests/firestore-rules
        run: pnpm exec firebase emulators:exec --config ../../firebase.emulator-tests.json --only firestore --project demo-ranking-audit "node --test rules.test.mjs"

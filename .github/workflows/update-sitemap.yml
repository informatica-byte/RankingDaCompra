name: Atualizar sitemap automaticamente

on:
  schedule:
    # A cada 30 minutos, fora do minuto cheio, para publicar novas ofertas mais rapidamente.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Gerar sitemap, páginas sociais e descoberta interna
        run: |
          if ! timeout 90s node scripts/generate-sitemap.mjs; then
            echo "::warning::O gerador principal ficou temporariamente indisponível. A descoberta interna continuará usando as páginas publicadas."
          fi
          node scripts/generate-discovery.mjs
          node scripts/product-title-corrections.mjs

      - name: Publicar sitemap e páginas sociais quando houver alteração
        id: publicar
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- sitemap.xml produto analises.html top5-semanal.json)" ]]; then
            echo "O sitemap, as páginas sociais e o diretório de análises já estão atualizados."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml produto analises.html top5-semanal.json
          git commit -m "Atualiza sitemap, análises, Top 5 e fotos de compartilhamento"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Avisar Bing, Yahoo e buscadores compatíveis pelo IndexNow
        if: steps.publicar.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

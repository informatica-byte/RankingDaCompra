name: Atualizar sitemap automaticamente

on:
  push:
    branches: [main]
    # Só alterações no gerador precisam reconstruir o site imediatamente.
    # Índice gerado, documentação e validadores não devem reler todo o Firebase.
    paths:
      - "scripts/generate-sitemap.mjs"
      - "home-selection.js"
      - "scripts/generate-discovery.mjs"
      - "scripts/comparison-guides.mjs"
      - "comparison-integrity.js"
      - "scripts/discovery-editorial.mjs"
      - "scripts/published-editorial.mjs"
      - "scripts/generate-home-static.mjs"
      - "scripts/generate-seasonal-guides.mjs"
      - "scripts/product-seo-titles.mjs"
      - "scripts/product-url-continuity.mjs"
      - "scripts/product-deduplication.mjs"
      - "scripts/product-removals.mjs"
      - "scripts/build-product-identity-index.mjs"
      - "product-uniqueness.js"
      - "product-url-aliases.json"
      - "scripts/product-title-corrections.mjs"
      - "scripts/highlight-editorial.mjs"
      - "scripts/manufacturer-specifications.mjs"
      - "scripts/marketplace-field-reviews.mjs"
      # Alterações apenas no transporte/autenticação não mudam as páginas.
      # Não reler o catálogo inteiro só por publicar uma otimização de leitura.
      - "scripts/public-catalogue.mjs"
      - "scripts/public-site-config.mjs"
      - "scripts/generate-best-choices.mjs"
      - "best-choices.js"
      - "promotion-title.js"
      - "scripts/product-decision.mjs"
      - "scripts/product-quick-summary.mjs"
      - "scripts/visibility-editorial.mjs"
      - "visibility-editorial.json"
      - "scripts/buying-advice.mjs"
      - "editorial-focus.json"
  schedule:
    # Uma conferência de segurança às 19:17 em Brasília (22:17 UTC).
    # Após cadastrar produtos ou conferir preços, use Run workflow para publicar antes.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      preserve_published_prices:
        description: "Bloquear publicação se algum preço já publicado mudar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Autenticar leitura do Firestore sem chave permanente
        id: firestore-auth
        uses: ./.github/actions/firestore-read-auth

      - name: Gerar sitemap, páginas sociais e descoberta interna
        env:
          RDC_FIRESTORE_ACCESS_TOKEN: ${{ steps.firestore-auth.outputs.access_token }}
          RDC_FIRESTORE_AUTH_REQUIRED: "true"
          PRESERVE_PUBLISHED_PRICES: ${{ inputs.preserve_published_prices || contains(github.event.head_commit.message, '[preservar-precos]') }}
          VERIFY_REVIEW_PAUSES: ${{ contains(github.event.head_commit.message, '[verificar-pausas]') }}
          # Nunca restaurar este cache entre publicações: uma nova execução lê
          # os dados atuais. Só retentativas da mesma execução reaproveitam páginas.
          RDC_FIRESTORE_READ_CACHE_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ "$PRESERVE_PUBLISHED_PRICES" == "true" ]]; then
            git show HEAD:vitrine-publica.json > "$RUNNER_TEMP/rdc-before-publication.json"
          fi
          generated=false
          for attempt in 1 2 3; do
            if timeout 100s node scripts/generate-sitemap.mjs; then
              generated=true
              break
            fi
            echo "::warning::Tentativa $attempt/3 do gerador falhou; aguardando para tentar novamente."
            sleep $((attempt * 10))
          done
          if [[ "$generated" != "true" ]]; then
            echo "::error::O gerador principal falhou após três tentativas. A publicação foi bloqueada para preservar o site."
            exit 1
          fi
          if [[ -f .ranking-generation-partial ]]; then
            echo "::warning::Firebase indisponível: a publicação atual foi preservada; a geração completa será tentada na próxima janela."
            echo "Firebase indisponível: sitemap, páginas, busca e Top 6 existentes foram preservados." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/product-title-corrections.mjs
          DISCOVERY_USE_GENERATED=true node scripts/generate-discovery.mjs
          node scripts/generate-home-static.mjs
          # Reutiliza as páginas recém-geradas; não consulta o Firebase.
          node scripts/update-price-history.mjs
          node scripts/generate-best-choices.mjs
          node scripts/product-removals.mjs
          if [[ "$VERIFY_REVIEW_PAUSES" == "true" ]]; then node scripts/verify-reviewed-pauses.mjs; fi
          node --test scripts/test-*.mjs
          node scripts/validate-site.mjs

      - name: Publicar sitemap e páginas sociais quando houver alteração
        id: publicar
        shell: bash
        env:
          PRESERVE_PUBLISHED_PRICES: ${{ inputs.preserve_published_prices || contains(github.event.head_commit.message, '[preservar-precos]') }}
          VERIFY_REVIEW_PAUSES: ${{ contains(github.event.head_commit.message, '[verificar-pausas]') }}
        run: |
          guard_prices() {
            if [[ "$PRESERVE_PUBLISHED_PRICES" == "true" ]]; then
              node scripts/publication-price-guard.mjs "$RUNNER_TEMP/rdc-before-publication.json" vitrine-publica.json || exit 1
            fi
            if [[ "$VERIFY_REVIEW_PAUSES" == "true" ]]; then node scripts/verify-reviewed-pauses.mjs || exit 1; fi
          }
          guard_prices
          if [[ -z "$(git status --porcelain -- index.html sitemap.xml produto presentes analises.html 'melhores-*.html' top5-semanal.json search-index.json historico-precos.json historico-precos-indice.json assets/price-history/ vitrine-publica.json site-config.json best-choices-guides.json product-deletions.json product-identities.json mercadolivre-status.json ':(top,glob)*.html')" ]]; then
            echo "O sitemap, as páginas sociais e o diretório de análises já estão atualizados."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html sitemap.xml produto presentes analises.html 'melhores-*.html' top5-semanal.json search-index.json historico-precos.json historico-precos-indice.json assets/price-history/ vitrine-publica.json site-config.json best-choices-guides.json product-deletions.json product-identities.json mercadolivre-status.json ':(top,glob)*.html'
          echo "Arquivos gerados alterados (validadores já aprovados; antes do push):"
          git diff --cached --name-only
          git commit -m "Atualiza sitemap, análises, busca e Top 6"
          git pull --rebase origin main
          guard_prices
          node scripts/validate-site.mjs
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Avisar Bing, Yahoo e buscadores compatíveis pelo IndexNow
        if: steps.publicar.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

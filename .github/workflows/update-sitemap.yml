name: Atualizar sitemap automaticamente

on:
  push:
    branches: [main]
    # Só alterações no gerador precisam reconstruir o site imediatamente.
    # Índice gerado, documentação e validadores não devem reler todo o Firebase.
    paths:
      - "scripts/generate-sitemap.mjs"
      - "scripts/generate-discovery.mjs"
  schedule:
    # Uma conferência de segurança às 19:17 em Brasília (22:17 UTC).
    # Após cadastrar produtos ou conferir preços, use Run workflow para publicar antes.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Gerar sitemap, páginas sociais e descoberta interna
        run: |
          generated=false
          for attempt in 1 2 3; do
            if timeout 240s node scripts/generate-sitemap.mjs; then
              generated=true
              break
            fi
            echo "::warning::Tentativa $attempt/3 do gerador falhou; aguardando para tentar novamente."
            sleep $((attempt * 10))
          done
          if [[ "$generated" != "true" ]]; then
            echo "::error::O gerador principal falhou após três tentativas. A publicação foi bloqueada para preservar o site."
            exit 1
          fi
          if [[ -f .ranking-generation-partial ]]; then
            echo "::warning::Firebase indisponível: a publicação atual foi preservada; a geração completa será tentada na próxima janela."
            echo "Firebase indisponível: sitemap, páginas, busca e Top 6 existentes foram preservados." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/product-title-corrections.mjs
          DISCOVERY_USE_GENERATED=true node scripts/generate-discovery.mjs
          node scripts/validate-site.mjs

      - name: Publicar sitemap e páginas sociais quando houver alteração
        id: publicar
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- sitemap.xml produto analises.html 'melhores-*.html' top5-semanal.json search-index.json)" ]]; then
            echo "O sitemap, as páginas sociais e o diretório de análises já estão atualizados."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml produto analises.html 'melhores-*.html' top5-semanal.json search-index.json
          git commit -m "Atualiza sitemap, análises, busca e Top 6"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Avisar Bing, Yahoo e buscadores compatíveis pelo IndexNow
        if: steps.publicar.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

name: Atualizar sitemap automaticamente

on:
  schedule:
    # A cada 5 minutos para novos produtos ganharem foto social rapidamente.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-sitemap
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar sitemap e páginas sociais com os dados do Firebase
        run: node scripts/generate-sitemap.mjs

      - name: Publicar sitemap e páginas sociais quando houver alteração
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- sitemap.xml produto)" ]]; then
            echo "O sitemap e as páginas sociais já estão atualizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml produto
          git commit -m "Atualiza sitemap e fotos de compartilhamento"
          git push

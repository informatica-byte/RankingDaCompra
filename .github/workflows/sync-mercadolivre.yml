name: Atualizar preços e disponibilidade


on:
  workflow_dispatch:
    inputs:
      force:
        description: "Repetir mesmo se o lote de hoje já terminou"
        required: false
        default: false
        type: boolean
  schedule:
    # Uma única conferência diária às 09:30 no horário de Brasília (12:30 UTC).
    - cron: "30 12 * * *"


permissions:
  contents: write


concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false


jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RDC_PRODUCTS_SNAPSHOT: .price-sync-products.json
      RDC_BATCH_SKIP_MARKER: .price-sync-skipped
      RDC_DAILY_BATCH: "true"
      RDC_FORCE_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v5


      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"


      - name: Consultar preços e disponibilidade
        env:
          MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
          MERCADO_LIVRE_CLIENT_ID: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
          MERCADO_LIVRE_CLIENT_SECRET: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
          MERCADO_LIVRE_TOKEN_KEY: ${{ secrets.MERCADO_LIVRE_TOKEN_KEY }}
          MERCADO_LIVRE_AUTHORIZATION_CODE: ${{ secrets.MERCADO_LIVRE_AUTHORIZATION_CODE }}
          MERCADO_LIVRE_REDIRECT_URI: https://rankingdacompra.com.br/oauth-mercadolivre.html
        run: |
          node --test scripts/test-sync-mercadolivre.mjs
          node --test scripts/test-daily-price-batch.mjs
          node scripts/sync-mercadolivre.mjs


      - name: Atualizar o sitemap e as páginas sociais
        shell: bash
        run: |
          if [[ -f "$RDC_BATCH_SKIP_MARKER" ]]; then
            echo "O lote de hoje já foi publicado; geração e novas leituras foram dispensadas."
            exit 0
          fi
          if ! node scripts/generate-sitemap.mjs; then
            echo "::warning::Firebase temporariamente indisponível; mantendo o sitemap e as páginas atuais."
            git restore --worktree -- sitemap.xml produto
          fi
          DISCOVERY_USE_GENERATED=true node scripts/generate-discovery.mjs
          rm -f "$RDC_PRODUCTS_SNAPSHOT"


      - name: Publicar somente quando houver mudança
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- mercadolivre-status.json sitemap.xml produto analises.html search-index.json .mercadolivre-token.enc)" ]]; then
            echo "Preços e disponibilidade continuam iguais."
            exit 0
          fi


          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mercadolivre-status.json sitemap.xml produto analises.html search-index.json
          if [[ -f .mercadolivre-token.enc ]]; then
            git add .mercadolivre-token.enc
          fi
          git commit -m "Atualiza preços e disponibilidade automaticamente"
          git pull --rebase origin main
          git push origin HEAD:main


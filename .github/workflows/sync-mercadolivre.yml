name: Atualizar preços e disponibilidade

on:
  # Execução apenas manual; a conferência diária é feita pelo robô local do navegador.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Consultar preços e disponibilidade
        env:
          MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
          MERCADO_LIVRE_CLIENT_ID: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
          MERCADO_LIVRE_CLIENT_SECRET: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
          MERCADO_LIVRE_TOKEN_KEY: ${{ secrets.MERCADO_LIVRE_TOKEN_KEY }}
          MERCADO_LIVRE_AUTHORIZATION_CODE: ${{ secrets.MERCADO_LIVRE_AUTHORIZATION_CODE }}
          MERCADO_LIVRE_REDIRECT_URI: https://rankingdacompra.com.br/oauth-mercadolivre.html
        run: node scripts/sync-mercadolivre.mjs

      - name: Atualizar o sitemap e as páginas sociais
        run: node scripts/generate-sitemap.mjs

      - name: Publicar somente quando houver mudança
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- mercadolivre-status.json sitemap.xml produto .mercadolivre-token.enc)" ]]; then
            echo "Preços e disponibilidade continuam iguais."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mercadolivre-status.json sitemap.xml produto
          if [[ -f .mercadolivre-token.enc ]]; then
            git add .mercadolivre-token.enc
          fi
          git commit -m "Atualiza preços e disponibilidade automaticamente"
          git push

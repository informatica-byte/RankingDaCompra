name: Atualizar preços e disponibilidade

on:
  schedule:
    # A cada duas horas, evitando o início da hora, quando há maior fila no GitHub.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-mercado-livre
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar preços e disponibilidade
        env:
          MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
        run: node scripts/sync-mercadolivre.mjs

      - name: Atualizar o sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Publicar somente quando houver mudança
        shell: bash
        run: |
          if git diff --quiet -- mercadolivre-status.json sitemap.xml; then
            echo "Preços e disponibilidade continuam iguais."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mercadolivre-status.json sitemap.xml
          git commit -m "Atualiza preços e disponibilidade automaticamente"
          git push

name: Atualizar preços e disponibilidade


on:
  workflow_dispatch:
    inputs:
      force:
        description: "Repetir mesmo se o lote de hoje já terminou"
        required: false
        default: false
        type: boolean


permissions:
  contents: write


concurrency:
  group: rankingdacompra-publicacao
  cancel-in-progress: false


jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    env:
      RDC_PRODUCTS_SNAPSHOT: .price-sync-products.json
      RDC_BATCH_SKIP_MARKER: .price-sync-skipped
      RDC_BATCH_PARTIAL_MARKER: .price-sync-partial
      RDC_OAUTH_PRESERVATION_MARKER: .price-sync-oauth-refreshed
      RDC_DAILY_BATCH: "true"
      RDC_FORCE_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@v5


      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Autenticar leitura do Firestore sem chave permanente
        id: firestore-auth
        uses: ./.github/actions/firestore-read-auth


      - name: Consultar preços e disponibilidade
        id: marketplace-query
        env:
          RDC_FIRESTORE_ACCESS_TOKEN: ${{ steps.firestore-auth.outputs.access_token }}
          RDC_FIRESTORE_AUTH_REQUIRED: "true"
          MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
          MERCADO_LIVRE_CLIENT_ID: ${{ secrets.MERCADO_LIVRE_CLIENT_ID }}
          MERCADO_LIVRE_CLIENT_SECRET: ${{ secrets.MERCADO_LIVRE_CLIENT_SECRET }}
          MERCADO_LIVRE_TOKEN_KEY: ${{ secrets.MERCADO_LIVRE_TOKEN_KEY }}
          MERCADO_LIVRE_AUTHORIZATION_CODE: ${{ secrets.MERCADO_LIVRE_AUTHORIZATION_CODE }}
          MERCADO_LIVRE_REDIRECT_URI: https://rankingdacompra.com.br/oauth-mercadolivre.html
        run: |
          node --test scripts/test-sync-mercadolivre.mjs
          node --test scripts/test-daily-price-batch.mjs
          node scripts/sync-mercadolivre.mjs


      - name: Atualizar o sitemap e as páginas sociais
        env:
          RDC_FIRESTORE_ACCESS_TOKEN: ${{ steps.firestore-auth.outputs.access_token }}
          RDC_FIRESTORE_AUTH_REQUIRED: "true"
        shell: bash
        run: |
          if [[ -f "$RDC_BATCH_SKIP_MARKER" ]]; then
            echo "O lote de hoje já foi publicado; geração e novas leituras foram dispensadas."
            exit 0
          fi
          if [[ -f "$RDC_BATCH_PARTIAL_MARKER" ]]; then
            echo "::warning::A conferência foi parcial; páginas e preços publicados foram preservados."
            rm -f "$RDC_PRODUCTS_SNAPSHOT"
            exit 0
          fi
          if ! node scripts/generate-sitemap.mjs; then
            echo "::warning::Firebase temporariamente indisponível; mantendo o sitemap e as páginas atuais."
            git restore --worktree -- sitemap.xml produto
            exit 0
          fi
          if [[ -f .ranking-generation-partial ]]; then
            echo "::warning::Fonte parcial; conteúdo publicado preservado."
            rm -f "$RDC_PRODUCTS_SNAPSHOT"
            exit 0
          fi
          DISCOVERY_USE_GENERATED=true node scripts/generate-discovery.mjs
          node scripts/generate-home-static.mjs
          # Registra somente observações confirmadas nas páginas, sem nova consulta.
          node scripts/update-price-history.mjs
          node scripts/generate-best-choices.mjs
          node scripts/product-removals.mjs
          node scripts/informational-site.mjs
          rm -f "$RDC_PRODUCTS_SNAPSHOT"


      - name: Publicar somente quando houver mudança
        run: |
          node --test scripts/test-audit-repairs.mjs scripts/test-price-presentation.mjs scripts/test-best-choices.mjs
          node scripts/validate-site.mjs

      - name: Publicar arquivos validados
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- index.html mercadolivre-status.json sitemap.xml produto presentes analises.html 'melhores-*.html' top5-semanal.json search-index.json historico-precos.json historico-precos-indice.json assets/price-history/ vitrine-publica.json site-config.json best-choices-guides.json informational-catalogue.json .mercadolivre-token.enc ':(top,glob)*.html')" ]]; then
            echo "Preços e disponibilidade continuam iguais."
            exit 0
          fi


          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html mercadolivre-status.json sitemap.xml produto presentes analises.html 'melhores-*.html' top5-semanal.json search-index.json historico-precos.json historico-precos-indice.json assets/price-history/ vitrine-publica.json site-config.json best-choices-guides.json informational-catalogue.json product-deletions.json product-identities.json ':(top,glob)*.html'
          if [[ -f .mercadolivre-token.enc ]]; then
            git add .mercadolivre-token.enc
          fi
          git commit -m "Atualiza preços e disponibilidade automaticamente"
          for tentativa in 1 2 3 4; do
            git pull --rebase origin main
            node scripts/validate-site.mjs
            if git push origin HEAD:main; then
              if [[ -f "$RDC_BATCH_PARTIAL_MARKER" ]]; then
                echo "Resultado parcial publicado; a conferência ainda não está completa."
              else
                echo "Conferência completa publicada com sucesso."
              fi
              exit 0
            fi
            echo "::warning::Outra automação publicou ao mesmo tempo; nova tentativa $tentativa de 4."
            sleep $((tentativa * 3))
          done
          echo "::error::Não foi possível publicar o lote após quatro tentativas seguras."
          exit 1

      # Um refresh pode ocorrer antes de o preflight/Firebase/validador falhar.
      # Preserva só a autorização nova, nunca os artefatos não validados.
      - name: Preservar autorização criptografada após falha posterior
        if: always() && steps.marketplace-query.outcome != 'skipped' && steps.marketplace-query.outcome != ''
        shell: bash
        run: |
          if [[ ! -f "$RDC_OAUTH_PRESERVATION_MARKER" || ! -f .mercadolivre-token.enc ]]; then
            echo "Autorização criptografada sem mudança a preservar."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { isEncryptedTokenEnvelope } from './scripts/sync-mercadolivre.mjs';
          let valid = false;
          try { valid = isEncryptedTokenEnvelope(JSON.parse(await readFile('.mercadolivre-token.enc', 'utf8'))); } catch {}
          if (!valid) throw new Error('Autorização criptografada inválida; preservação bloqueada.');
          NODE
          git fetch origin main
          if git diff --quiet origin/main -- .mercadolivre-token.enc; then
            echo "A autorização renovada já está preservada no repositório."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Checkout isolado: nenhum commit/arquivo de uma publicação interrompida
          # acompanha a autorização, mesmo se o checkout principal estiver em rebase.
          oauth_worktree=$(mktemp -d)
          git worktree add --detach "$oauth_worktree" origin/main
          trap 'git worktree remove --force "$oauth_worktree"' EXIT
          cp -- .mercadolivre-token.enc "$oauth_worktree/.mercadolivre-token.enc"
          git -C "$oauth_worktree" add -- .mercadolivre-token.enc
          git -C "$oauth_worktree" commit --only -m "Preserva autorizacao criptografada apos interrupcao do lote" -- .mercadolivre-token.enc
          for tentativa in 1 2 3 4; do
            git -C "$oauth_worktree" pull --rebase origin main
            if git -C "$oauth_worktree" push origin HEAD:main; then
              echo "Autorização criptografada preservada; o resultado da conferência continua sinalizado separadamente."
              exit 0
            fi
            sleep $((tentativa * 3))
          done
          echo "::error::Não foi possível preservar a autorização criptografada."
          exit 1

      - name: Sinalizar conferência parcial
        if: always()
        shell: bash
        run: |
          if [[ -f "$RDC_BATCH_PARTIAL_MARKER" ]]; then
           echo "::error::A conferência foi parcial; o último preço válido foi preservado, mas os produtos com erro ainda precisam de verificação."
           exit 1
          fi

